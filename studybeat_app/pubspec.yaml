name: studybeat
description: Studybeat — your personal AI-powered study companion that creates the perfect study environment.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  flutter_riverpod: ^3.3.2
  google_fonts: ^6.3.2
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.3
  percent_indicator: ^4.2.5
  animations: ^2.1.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.5.0
  build_runner: ^2.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
